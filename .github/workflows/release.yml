name: Build installer and publish update

on:
  push:
    tags:
      - 'v*'
      - 'test-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/BotNC.App/BotNC.App.csproj'
          $tagPrefix = if ($env:GITHUB_REF_NAME.StartsWith('test-v')) { 'test-v' } else { 'v' }
          $version = [string](($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version)
          $expected = $tagPrefix + $version.Trim()
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $expected."
          }
      - name: Validate licensing configuration
        shell: pwsh
        env:
          LICENSE_URL: ${{ vars.PEXBOT_LICENSE_URL }}
          LICENSE_PUBLIC_KEY: ${{ vars.PEXBOT_LICENSE_PUBLIC_KEY }}
          SOURCE_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_TOKEN_PRESENT: ${{ secrets.PEXBOT_RELEASE_TOKEN != '' }}
        run: |
          if (($env:LICENSE_URL -and -not $env:LICENSE_PUBLIC_KEY) -or
              ($env:LICENSE_PUBLIC_KEY -and -not $env:LICENSE_URL)) {
            throw 'Set both PEXBOT_LICENSE_URL and PEXBOT_LICENSE_PUBLIC_KEY.'
          }
          if ($env:SOURCE_PRIVATE -eq 'true' -and -not $env:LICENSE_URL) {
            throw 'Private-source releases must enable activation before publication.'
          }
          if ($env:SOURCE_PRIVATE -eq 'true' -and $env:RELEASE_TOKEN_PRESENT -ne 'true') {
            throw 'Private-source releases require PEXBOT_RELEASE_TOKEN for the public download repositories.'
          }
      - name: Publish application
        shell: pwsh
        env:
          LICENSE_URL: ${{ vars.PEXBOT_LICENSE_URL }}
          LICENSE_PUBLIC_KEY: ${{ vars.PEXBOT_LICENSE_PUBLIC_KEY }}
        run: |
          $channel = if ($env:GITHUB_REF_NAME.StartsWith('test-v')) { 'Testing' } else { 'Stable' }
          dotnet publish src/BotNC.App/BotNC.App.csproj -c Release -r win-x64 --self-contained true -p:BuildChannel=$channel -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None "-p:LicenseServerUrl=$env:LICENSE_URL" "-p:LicensePublicKey=$env:LICENSE_PUBLIC_KEY" -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Application publish failed.' }
      - name: Validate packaged detectors
        shell: pwsh
        run: |
          $selfTest = Join-Path $env:RUNNER_TEMP 'pexbot-self-test.txt'
          $audioTest = Join-Path $env:RUNNER_TEMP 'pexbot-audio-test.txt'
          $executable = if ($env:GITHUB_REF_NAME.StartsWith('test-v')) { 'PEXBOT-Teste.exe' } else { 'PEXBOT.exe' }
          $app = (Resolve-Path (Join-Path 'publish' $executable)).Path
          $selfTestProcess = Start-Process -FilePath $app `
            -ArgumentList @('--self-test', ('"' + $selfTest + '"')) `
            -PassThru -Wait -WindowStyle Hidden
          if ($selfTestProcess.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $selfTest)) {
            throw 'Packaged visual self-test failed.'
          }
          $audioReference = (Resolve-Path 'publish/Assets/Audio/hp_alert_som2_full.wav').Path
          $audioTestProcess = Start-Process -FilePath $app `
            -ArgumentList @('--audio-self-test', ('"' + $audioReference + '"'), ('"' + $audioTest + '"')) `
            -PassThru -Wait -WindowStyle Hidden
          if ($audioTestProcess.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $audioTest)) {
            throw 'Packaged audio self-test failed.'
          }
          $audioResult = Get-Content -LiteralPath $audioTest -Raw
          if ($audioResult -notmatch 'prefixDetections=[1-9]' -or $audioResult -notmatch 'fullDetections=[1-9]') {
            throw "Packaged audio detector did not recognize its alert reference: $audioResult"
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build installer and checksum
        shell: pwsh
        run: |
          $compiler = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler was not found.' }
          $version = if ($env:GITHUB_REF_NAME.StartsWith('test-v')) {
            $env:GITHUB_REF_NAME.Substring(6)
          } else {
            $env:GITHUB_REF_NAME.Substring(1)
          }
          $published = (Resolve-Path 'publish').Path
          $testing = $env:GITHUB_REF_NAME.StartsWith('test-v')
          $prefix = if ($testing) { 'PEXBOT-Teste-Setup-v' } else { 'PEXBOT-Setup-v' }
          $channelFlag = if ($testing) { '/dTestChannel=1' } else { '/dStableChannel=1' }
          & $compiler "/dPublishDir=$published" "/dAppVersion=$version" $channelFlag 'installer/PEXBOT.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          $installer = "artifacts/${prefix}${version}.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "artifacts/${prefix}${version}.sha256" -Value "$hash  ${prefix}${version}.exe" -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PEXBOT_RELEASE_TOKEN || github.token }}
        run: |
          $testing = $env:GITHUB_REF_NAME.StartsWith('test-v')
          $targetRepo = if ($testing) { 'lipex15/ncbotz-testing' } else { 'lipex15/ncbotz' }
          $version = if ($testing) {
            $env:GITHUB_REF_NAME.Substring(6)
          } else {
            $env:GITHUB_REF_NAME.Substring(1)
          }
          $prefix = if ($testing) { 'PEXBOT-Teste-Setup-v' } else { 'PEXBOT-Setup-v' }
          $installer = "artifacts/${prefix}${version}.exe"
          $checksum = "artifacts/${prefix}${version}.sha256"
          gh release view $env:GITHUB_REF_NAME --repo $targetRepo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer $checksum --clobber --repo $targetRepo
          } else {
            $title = if ($testing) { "PEXBOT Teste v$version" } else { "PEXBOT v$version" }
            $notesFile = "docs/PATCH_${version}.md"
            if (Test-Path -LiteralPath $notesFile) {
              gh release create $env:GITHUB_REF_NAME $installer $checksum --repo $targetRepo --target main --title $title --notes-file $notesFile
            } else {
              gh release create $env:GITHUB_REF_NAME $installer $checksum --repo $targetRepo --target main --title $title --generate-notes
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
