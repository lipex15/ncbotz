name: Build installer and publish update

on:
  push:
    tags:
      - 'v*'
      - 'test-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -notin @('lipex15/ncbotz', 'lipex15/ncbotz-testing')) {
            throw "Unexpected repository $env:GITHUB_REPOSITORY"
          }
          [xml]$project = Get-Content 'src/BotNC.App/BotNC.App.csproj'
          $tagPrefix = if ($env:GITHUB_REPOSITORY -eq 'lipex15/ncbotz-testing') { 'test-v' } else { 'v' }
          $version = [string](($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version)
          $expected = $tagPrefix + $version.Trim()
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $expected."
          }
      - name: Publish application
        shell: pwsh
        run: |
          $channel = if ($env:GITHUB_REPOSITORY -eq 'lipex15/ncbotz-testing') { 'Testing' } else { 'Stable' }
          dotnet publish src/BotNC.App/BotNC.App.csproj -c Release -r win-x64 --self-contained true -p:BuildChannel=$channel -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Application publish failed.' }
      - name: Validate packaged detectors
        shell: pwsh
        run: |
          $selfTest = Join-Path $env:RUNNER_TEMP 'pexbot-self-test.txt'
          $audioTest = Join-Path $env:RUNNER_TEMP 'pexbot-audio-test.txt'
          $executable = if ($env:GITHUB_REPOSITORY -eq 'lipex15/ncbotz-testing') { 'PEXBOT-Teste.exe' } else { 'PEXBOT.exe' }
          $app = (Resolve-Path (Join-Path 'publish' $executable)).Path
          $selfTestProcess = Start-Process -FilePath $app `
            -ArgumentList @('--self-test', ('"' + $selfTest + '"')) `
            -PassThru -Wait -WindowStyle Hidden
          if ($selfTestProcess.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $selfTest)) {
            throw 'Packaged visual self-test failed.'
          }
          $audioReference = (Resolve-Path 'publish/Assets/Audio/hp_alert_som2_full.wav').Path
          $audioTestProcess = Start-Process -FilePath $app `
            -ArgumentList @('--audio-self-test', ('"' + $audioReference + '"'), ('"' + $audioTest + '"')) `
            -PassThru -Wait -WindowStyle Hidden
          if ($audioTestProcess.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $audioTest)) {
            throw 'Packaged audio self-test failed.'
          }
          $audioResult = Get-Content -LiteralPath $audioTest -Raw
          if ($audioResult -notmatch 'prefixDetections=[1-9]' -or $audioResult -notmatch 'fullDetections=[1-9]') {
            throw "Packaged audio detector did not recognize its alert reference: $audioResult"
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build installer and checksum
        shell: pwsh
        run: |
          $compiler = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler was not found.' }
          $version = if ($env:GITHUB_REPOSITORY -eq 'lipex15/ncbotz-testing') {
            $env:GITHUB_REF_NAME.Substring(6)
          } else {
            $env:GITHUB_REF_NAME.Substring(1)
          }
          $published = (Resolve-Path 'publish').Path
          $testing = $env:GITHUB_REPOSITORY -eq 'lipex15/ncbotz-testing'
          $prefix = if ($testing) { 'PEXBOT-Teste-Setup-v' } else { 'PEXBOT-Setup-v' }
          $channelFlag = if ($testing) { '/dTestChannel=1' } else { '/dStableChannel=1' }
          & $compiler "/dPublishDir=$published" "/dAppVersion=$version" $channelFlag 'installer/PEXBOT.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          $installer = "artifacts/${prefix}${version}.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "artifacts/${prefix}${version}.sha256" -Value "$hash  ${prefix}${version}.exe" -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = if ($env:GITHUB_REPOSITORY -eq 'lipex15/ncbotz-testing') {
            $env:GITHUB_REF_NAME.Substring(6)
          } else {
            $env:GITHUB_REF_NAME.Substring(1)
          }
          $prefix = if ($env:GITHUB_REPOSITORY -eq 'lipex15/ncbotz-testing') { 'PEXBOT-Teste-Setup-v' } else { 'PEXBOT-Setup-v' }
          $installer = "artifacts/${prefix}${version}.exe"
          $checksum = "artifacts/${prefix}${version}.sha256"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer $checksum --clobber
          } else {
            $title = if ($env:GITHUB_REPOSITORY -eq 'lipex15/ncbotz-testing') { "PEXBOT Teste v$version" } else { "PEXBOT v$version" }
            gh release create $env:GITHUB_REF_NAME $installer $checksum --verify-tag --title $title --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
